name: CI

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-22.04, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libboost-program-options-dev python3

      - name: Cache Homebrew packages (macOS)
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            /usr/local/Cellar/boost
            /opt/homebrew/Cellar/boost
          key: homebrew-boost-${{ runner.arch }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: homebrew-boost-${{ runner.arch }}-

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install boost && brew link boost || brew link --overwrite boost

      - name: Configure cmake
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$(brew --prefix boost)" -Bcmake-build-release -H.
          else
            cmake -DCMAKE_BUILD_TYPE=Release -Bcmake-build-release -H.
          fi

      - name: Build all targets
        run: |
          cmake --build cmake-build-release --target solvitaire
          cmake --build cmake-build-release --target solvitaire-flat
          cmake --build cmake-build-release --target solvitaire-hash-only
          cmake --build cmake-build-release --target solvitaire-lru
          cmake --build cmake-build-release --target unit_tests

      - name: Run unit tests
        run: cd cmake-build-release && ctest -R '^unit_tests$' --output-on-failure

      - name: Run regression level 1
        run: cd cmake-build-release && ctest -R regression_level1 --output-on-failure
